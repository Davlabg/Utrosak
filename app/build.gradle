plugins {
    id 'com.android.application'
}

android {
    namespace 'com.davlabg.utrosak'
    compileSdk 35

    defaultConfig {
        applicationId 'com.davlabg.utrosak'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            storeFile file('utrosak.jks')
            storePassword 'utrosak'
            keyAlias 'utrosak'
            keyPassword 'utrosak'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
